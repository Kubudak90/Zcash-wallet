<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>s03-promises</title>
  <link rel="stylesheet" href="/lib/stage.css" />
  <style>
    /* scene-only styles (static; every movement goes through lib/stage.js) */
    .pc { position: absolute; overflow: hidden; background: var(--surface); }
    .pc .edge { position: absolute; left: 0; top: 0; width: 100%; height: 2px; transform-origin: 0 50%;
      background: linear-gradient(90deg, color-mix(in srgb, var(--text) 0%, transparent), color-mix(in srgb, var(--text) 34%, transparent) 30%, color-mix(in srgb, var(--text) 10%, transparent) 100%); }
    .pc .h { font-size: 36px; font-weight: 600; line-height: 1.15; letter-spacing: -0.005em; color: var(--text); }
    .pc .p { margin-top: 8px; font-size: 28px; line-height: 1.36; color: var(--muted); text-wrap: pretty; }
    .pc .chips { margin-top: auto; padding-top: 14px; display: flex; align-items: center; gap: 12px; }
    .pc .chip { font-size: 23px; padding: 7px 18px; gap: 10px; }
    .pc .chip.mono { font-family: var(--font-mono); font-size: 22px; letter-spacing: 0; padding: 7px 18px; }
    .pc .chip.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); }
    .pc .sep { font-size: 24px; color: var(--subtle); }
    .dot.half { background: linear-gradient(90deg, currentColor 50%, transparent 50%); border: 3px solid currentColor; }
    .stat .num { font-size: 90px; line-height: 1; color: var(--accent-fg); white-space: nowrap; }
    .stat .lab { margin-top: 12px; font-size: 30px; font-weight: 560; color: var(--text); line-height: 1.2; }
    .stat .sub { margin-top: 6px; font-size: 28px; color: var(--muted); line-height: 1.3; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
