[package]
name = "zcash_client_memory"
# Celari's port of ChainSafe's in-memory wallet backend. See UPSTREAM.md for the
# origin of this crate and what Celari changed. Not published to crates.io.
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false
# No build script, and none picked up by accident (review round 7, DRIFT-2): cargo would
# otherwise run any build.rs left in this directory, and engine/ reaches the WebZjs build
# through a symlink to the working tree.
build = false

# This crate is not a member of the WebZjs workspace (it lives next to it, in
# Celari's engine/ directory), so every dependency is spelled out here instead
# of inheriting `workspace = true`. Versions are the librustzcash cohort of
# 2026-10-21 (zcash_client_backend 0.25, zcash_primitives 0.31, ...), the same
# as in the patched WebZjs workspace; the WebZjs Cargo.lock pins them.
[dependencies]
zcash_address = "0.14.0"
zcash_client_backend = { version = "0.25.0", default-features = false, features = ["unstable-serialization", "unstable-spanning-tree", "sync"] }
zcash_encoding = { version = "0.5", default-features = false }
zcash_keys = { version = "0.17.0", features = ["sapling"] }
zcash_primitives = "0.31.0"
zcash_protocol = { version = "0.11.0", default-features = false }
transparent = { package = "zcash_transparent", version = "0.11.0", default-features = false }
zip32 = "0.3"

tokio = { version = "1.0", features = ["sync"] }

# Dependencies exposed in a public API:
# (Breaking upgrades to these require a breaking upgrade to this crate.)
# - Errors
bip32 = { version = "0.6", default-features = false, features = ["alloc"], optional = true }
bs58 = { version = "0.5", default-features = false, features = ["alloc", "check"] }

# - Logging and metrics
tracing = "0.1.40"

# - Serialization
byteorder = "1"
nonempty = "0.11"
group = "0.14"
jubjub = "0.11"
serde = { version = "1", features = ["derive"], default-features = false }

# - Secret management
secrecy = "0.8.0"
subtle = "2.6.1"

# - Static assertions
static_assertions = "1"

# - Shielded protocols
orchard = { version = "0.16", default-features = false, optional = true }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }

# - Transparent protocol
secp256k1 = { version = "0.33", optional = true }
zcash_script = { version = "0.6", default-features = false }

# - Note commitment trees
incrementalmerkletree = { version = "0.9", default-features = false }
shardtree = { version = "0.8", features = ["legacy-api"] }

thiserror = "1.0.61"
hex = "0.4.3"
rayon = { version = "1.8", features = ["web_spin_lock"] }
async-trait = "0.1"

# - Test dependencies
proptest = { version = "1", optional = true }
wasm_sync = "0.1.2"
time = { version = "0.3.22", default-features = false, features = ["std"] }
bytes = "1.9.0"

# On wasm32, `time::OffsetDateTime::now_utc` must read the JavaScript clock
# (`std::time::SystemTime::now` panics on wasm32-unknown-unknown).
[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { version = "0.3.22", default-features = false, features = ["std", "wasm-bindgen"] }

[dev-dependencies]
ciborium = "0.2.2"
# Decodes the lightwalletd messages of the mainnet test vectors (testdata/).
prost = { version = "0.14", default-features = false, features = ["std"] }
serde_json = "1"
postcard = { version = "1.0.10", features = ["alloc"] }
zcash_client_backend = { version = "0.25.0", default-features = false, features = ["test-dependencies"] }


[features]
default = ["multicore"]
local-consensus = ["zcash_protocol/local-consensus"]
## Enables multithreading support for creating proofs and building subtrees.
multicore = ["zcash_primitives/multicore"]

## Enables support for storing data related to the sending and receiving of
## Orchard funds (and, since zcash_client_backend 0.25, Ironwood funds, which
## use Orchard-shaped notes in a separate pool).
orchard = ["dep:orchard", "zcash_client_backend/orchard", "zcash_keys/orchard"]

## Exposes APIs that are useful for testing, such as `proptest` strategies.
test-dependencies = [
  "dep:proptest",
  "incrementalmerkletree/test-dependencies",
  "shardtree/test-dependencies",
  "zcash_primitives/test-dependencies",
  "zcash_client_backend/test-dependencies",
]

## Runs the upstream PCZT tests (zcash_client_backend's `pczt` feature) in `cargo test`.
pczt-tests = ["zcash_client_backend/pczt"]

## Enables receiving transparent funds and sending to transparent recipients
transparent-inputs = [
  "dep:bip32",
  "dep:secp256k1",
  "zcash_keys/transparent-inputs",
  "zcash_client_backend/transparent-inputs"
]

# Enables operations that permit arbitrary transparent pubkeys to be associated
# with an account in the wallet. Applications that rely on this feature must
# maintain spending keys corresponding to all imported pubkeys for any account
# from which it permits spending.
transparent-key-import = [
  "transparent-inputs",
  "zcash_client_backend/transparent-key-import"
]

#! ### Experimental features

## Exposes unstable APIs. Their behaviour may change at any time.
unstable = ["zcash_client_backend/unstable"]

## Enables compatibility with legacy zcashd wallet data
zcashd-compat = ["zcash_keys/zcashd-compat", "zcash_client_backend/zcashd-compat"]

## Enables the prospective ZIP 233 (Network Sustainability Mechanism) feature.
zip-233 = ["zcash_primitives/zip-233"]
